  models.GateAttendanceSummary:
    properties:
      checkInPercentage:
        type: number
      remainingCheckIn:
        type: integer
      totalCheckedIn:
        type: integer
      totalTicketsIssued:
        type: integer
    type: object
  models.OrderRecord:
    properties:
      artist:
        type: string
      categoryName:
        type: string
      createdAt:
        type: string
      date:
        type: string
      eventId:
        type: string
      eventTime:
        type: string
      eventTitle:
        type: string
      id:
        type: string
      openGate:
        type: string
      orderCode:
        type: string
      paymentMethod:
        type: string
      qrCode:
        type: string
      quantity:
        type: integer
      status:
        type: string
      totalPrice:
        type: number
      userEmail:
        type: string
      userId:
        type: string
      userName:
        type: string
      venue:
        type: string
      venueAddress:
        type: string
    type: object
  models.PasswordLoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.RecentOrderSummary:
    properties:
      createdAt:
        type: string
      eventTitle:
        type: string
      id:
        type: string
      orderCode:
        type: string
      quantity:
