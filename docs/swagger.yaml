  models.EventItem:
    properties:
      address:
        type: string
      artist:
        type: string
      audioUrl:
        type: string
      categories:
        items:
          $ref: '#/definitions/models.TicketCategory'
        type: array
      category:
        type: string
      categoryBadgeColor:
        type: string
      conductor:
        type: string
      date:
        type: string
      description:
        type: string
      eventDateTime:
        type: string
      id:
        type: string
      image:
        type: string
      isClosed:
        type: boolean
      openGate:
        type: string
      organizer:
        type: string
      rundown:
        items:
          $ref: '#/definitions/models.RundownItem'
        type: array
      subtitle:
        type: string
      time:
        type: string
      title:
        type: string
      venue:
        type: string
    type: object
  models.EventRevenueStat:
    properties:
      eventId:
