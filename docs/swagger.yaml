        type: integer
    type: object
  models.TimelineStat:
    properties:
      month:
        type: string
      revenue:
        type: number
      tickets:
        type: integer
    type: object
  models.UpdateEventRequest:
    properties:
      address:
        type: string
      artist:
        type: string
      audioUrl:
        type: string
      category:
        type: string
      categoryBadgeColor:
        type: string
      conductor:
        type: string
      date:
        type: string
      description:
        type: string
      image:
        type: string
      openGate:
        type: string
      organizer:
        type: string
      rundown:
        items:
          $ref: '#/definitions/models.RundownItem'
        type: array
      subtitle:
        type: string
      time:
        type: string
      title:
        type: string
      venue:
        type: string
    type: object
  models.UpdateOrderStatusRequest:
    properties:
      status:
        type: string
    type: object
  models.UpdateProfileInput:
    properties:
      name:
        type: string
      phone:
        type: string
    type: object
  models.UpdateRefundStatusRequest:
    properties:
      adminNote:
        type: string
      status:
        type: string
    type: object
  models.UpdateTicketCategoryRequest:
    properties:
      name:
        type: string
