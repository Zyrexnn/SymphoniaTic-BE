      userName:
        type: string
    type: object
  models.RefundRequestRecord:
    properties:
      accountHolder:
        type: string
      accountNumber:
        type: string
      adminNote:
        type: string
      bankName:
        type: string
      categoryName:
        type: string
      createdAt:
        type: string
