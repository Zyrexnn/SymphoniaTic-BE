        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  models.AdminLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.AuthResponseData:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.UserRecord'
    type: object
  models.ChangePasswordInput:
    properties:
      newPassword:
        type: string
      oldPassword:
        type: string
    type: object
  models.CreateCategoryInput:
    properties:
      name:
        type: string
      price:
        type: number
      quota:
        type: integer
    type: object
  models.CreateEventRequest:
    properties:
      address:
        type: string
      artist:
        type: string
      audioUrl:
        type: string
      categories:
        items:
          $ref: '#/definitions/models.CreateCategoryInput'
        type: array
      category:
        type: string
      categoryBadgeColor:
        type: string
      conductor:
        type: string
      date:
        type: string
      description:
        type: string
      image:
        type: string
      openGate:
        type: string
      organizer:
        type: string
      rundown:
        items:
          $ref: '#/definitions/models.RundownItem'
        type: array
      subtitle:
        type: string
      time:
        type: string
      title:
        type: string
      venue:
        type: string
    type: object
  models.CreateOrderRequest:
    properties:
      eventId:
        type: string
      quantity:
        type: integer
      ticketCategoryId:
        type: string
      userEmail:
        type: string
      userName:
        type: string
    type: object
  models.EventItem:
    properties:
      address:
        type: string
      artist:
        type: string
      audioUrl:
        type: string
      categories:
        items:
          $ref: '#/definitions/models.TicketCategory'
        type: array
      category:
        type: string
      categoryBadgeColor:
        type: string
      conductor:
        type: string
      date:
        type: string
      description:
        type: string
      eventDateTime:
        type: string
      id:
        type: string
      image:
        type: string
      isClosed:
        type: boolean
      openGate:
        type: string
      organizer:
        type: string
      rundown:
        items:
          $ref: '#/definitions/models.RundownItem'
        type: array
      subtitle:
        type: string
      time:
        type: string
      title:
        type: string
      venue:
        type: string
    type: object
  models.OrderRecord:
    properties:
      artist:
        type: string
      categoryName:
        type: string
      createdAt:
        type: string
      date:
        type: string
      eventId:
        type: string
      eventTitle:
        type: string
      id:
        type: string
      orderCode:
        type: string
      paymentMethod:
        type: string
      qrCode:
        type: string
      quantity:
        type: integer
      status:
        type: string
      totalPrice:
        type: number
      userEmail:
        type: string
      userId:
        type: string
      userName:
        type: string
      venue:
        type: string
    type: object
  models.PasswordLoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.RefundRequestRecord:
    properties:
      accountHolder:
        type: string
      accountNumber:
        type: string
      adminNote:
        type: string
      bankName:
        type: string
      categoryName:
        type: string
      createdAt:
        type: string
      eventTitle:
        description: Joined details for UI/Admin
        type: string
      id:
        type: string
      orderCode:
        type: string
      orderId:
        type: string
      quantity:
        type: integer
      reason:
        type: string
      refundAmount:
        type: number
      status:
        type: string
      updatedAt:
        type: string
      userEmail:
        type: string
      userName:
        type: string
    type: object
  models.RegisterRequestOTPInput:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  models.RegisterVerifyOTPInput:
    properties:
      email:
        type: string
      name:
        type: string
      otpCode:
        type: string
      password:
