      pastEventsCount:
        type: integer
      totalTicketsBought:
        type: integer
      upcomingEventsCount:
        type: integer
    type: object
  models.UserRecord:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      isVerified:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    email: support@symphoniatic.id
    name: SymphoniaTic API Support
  description: Interactive OpenAPI/Swagger UI documentation for SymphoniaTic Concert
    Ticketing Platform.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: SymphoniaTic REST API Documentation
  version: "1.0"
paths:
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus satu kategori tiket konser berdasarkan ID kategori.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kategori tiket berhasil dihapus
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Kategori tiket tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Menghapus kategori tiket konser (Admin)
      tags:
      - Admin - Ticket Categories
    put:
      consumes:
      - application/json
      description: Memperbarui nama, harga, dan kuota dari kategori tiket konser yang
        sudah ada.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Category Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTicketCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Kategori tiket berhasil diperbarui
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Kategori tiket tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Memperbarui kategori tiket konser (Admin)
      tags:
      - Admin - Ticket Categories
  /admin/dashboard:
    get:
      consumes:
      - application/json
      description: Mengagregasi metrik analitik bisnis (total pendapatan, tiket terjual,
        sisa kuota, timeline bulanan).
      produces:
      - application/json
      responses:
        "200":
          description: Metrik admin berhasil diambil
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AdminDashboardMetrics'
              type: object
      security:
      - BearerAuth: []
      summary: Mengambil ringkasan metrik dashboard admin
      tags:
      - Admin - Analytics
  /admin/events:
    post:
      consumes:
      - application/json
      description: Menambahkan event konser baru ke dalam sistem beserta kategori
        tiket awal.
      parameters:
      - description: Create Event Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Berhasil menambahkan konser baru
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.EventItem'
              type: object
        "400":
          description: Judul, Artis, Venue, Tanggal wajib diisi
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Membuat event/konser baru (Admin)
      tags:
      - Admin - Events Management
  /admin/events/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus acara konser dari sistem beserta seluruh kategori tiket
        yang berada di bawahnya.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event konser dan kategori tiket terkait berhasil dihapus
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Event konser tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Menghapus konser dan kategori tiket terkait (Admin)
      tags:
      - Admin - Events Management
    put:
      consumes:
      - application/json
      description: Memperbarui rincian metadata konser musik klasik berdasarkan ID
        konser.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Event Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Event konser berhasil diperbarui
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Format request tidak valid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Event konser tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Memperbarui data konser (Admin)
      tags:
      - Admin - Events Management
  /admin/events/{id}/categories:
    post:
      consumes:
      - application/json
      description: 'Menambahkan kelas tiket baru (misal: VIP, Regular) dengan kuota
        dan harga spesifik ke konser.'
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Create Category Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.CreateCategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Kategori tiket berhasil ditambahkan
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TicketCategory'
              type: object
        "400":
          description: Nama, Harga, dan Kuota tiket wajib valid
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Menambahkan kategori tiket baru ke konser (Admin)
      tags:
      - Admin - Ticket Categories
  /admin/events/{id}/toggle-close:
    patch:
      consumes:
      - application/json
      description: Mengubah status penjualan tiket konser antara terbuka atau ditutup
        secara instan.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Status penutupan konser berhasil diperbarui
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Konser tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Membuka atau menutup penjualan tiket konser (Admin)
      tags:
      - Admin - Events Management
  /admin/login:
    post:
      consumes:
      - application/json
      description: Autentikasi khusus akun administrator untuk mengakses panel manajemen
        admin.
      parameters:
      - description: Admin Login Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login Admin berhasil
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AuthResponseData'
              type: object
        "401":
          description: Username atau Password Admin salah
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Login Administrator
      tags:
      - Auth - Admin
  /admin/orders:
    get:
      consumes:
      - application/json
      description: Mengambil riwayat seluruh pesanan dengan filter pencarian teks
        dan status.
      parameters:
      - description: Search query (order code, name, email, event)
        in: query
        name: search
        type: string
      - description: Filter by order status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar pesanan berhasil diambil
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.OrderRecord'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Mengambil semua pesanan tiket (Admin)
      tags:
      - Admin - Orders Management
  /admin/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: 'Memperbarui status pesanan tiket (misal: CHECKED_IN, REMINDED,
        REFUNDED) oleh admin atau petugas.'
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Order Status Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Status pesanan berhasil diperbarui
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Pesanan tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Memperbarui status pesanan tiket (Admin)
      tags:
      - Admin - Orders Management
  /admin/refunds:
    get:
      consumes:
      - application/json
      description: Mengambil seluruh permohonan refund tiket yang diajukan oleh pengguna.
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar permohonan refund
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.RefundRequestRecord'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Mengambil semua permohonan refund (Admin)
      tags:
      - Admin - Refund Management
  /admin/refunds/{id}/status:
    patch:
      consumes:
      - application/json
      description: Memperbarui status permohonan refund menjadi APPROVED, REJECTED,
        atau COMPLETED beserta catatan admin.
      parameters:
      - description: Refund ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Refund Status Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UpdateRefundStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Status pengajuan refund berhasil diubah
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Status tidak valid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Data refund tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Menyetujui atau menolak permohonan refund (Admin)
      tags:
      - Admin - Refund Management
  /admin/tickets/attendance-summary:
    get:
      consumes:
      - application/json
      description: Menghitung jumlah tiket masuk (CHECKED_IN) dibanding total tiket
        aktif yang diterbitkan.
      parameters:
      - description: Filter berdasarkan ID Konser (opsional)
        in: query
        name: event_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ringkasan kehadiran berhasil dimuat
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.GateAttendanceSummary'
              type: object
        "500":
          description: Gagal menghitung ringkasan kehadiran
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Ringkasan kehadiran penonton di gate (Admin / Petugas)
      tags:
      - Admin - Tickets
  /admin/tickets/checkin:
    post:
      consumes:
      - application/json
      description: Memvalidasi dan mengubah status tiket menjadi CHECKED_IN secara
        atomik.
      parameters:
      - description: Ticket Check-In Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.CheckInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Check-in berhasil
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.OrderRecord'
              type: object
        "400":
          description: Tiket sudah digunakan atau status tidak valid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Tiket tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Check-in tiket konser (Admin / Petugas)
      tags:
      - Admin - Tickets
  /admin/upload:
    post:
      consumes:
      - multipart/form-data
      description: Menyimpan file gambar ke direktori server lokal dan mengembalikan
        URL publik.
      parameters:
      - description: File gambar poster (jpg/png/webp)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: File gambar berhasil diunggah
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Gagal membaca file gambar
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Mengunggah gambar poster/banner konser (Admin)
      tags:
      - Admin - Events Management
  /auth/login/password:
    post:
      consumes:
      - application/json
      description: Autentikasi user menggunakan email dan password tradisional.
      parameters:
      - description: Login Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.PasswordLoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil!
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AuthResponseData'
              type: object
        "401":
          description: Email atau password salah
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Login dengan Email & Password
      tags:
      - Auth - User
  /auth/register/request-otp:
    post:
      consumes:
      - application/json
      description: Mengirimkan 6 digit kode OTP registrasi ke email pengguna.
      parameters:
      - description: Register Request OTP Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequestOTPInput'
      produces:
      - application/json
      responses:
        "200":
          description: Kode OTP registrasi berhasil dikirim
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Payload tidak valid / Email terdaftar
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Cooldown OTP (tunggu 60s)
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Meminta kode OTP untuk registrasi
      tags:
      - Auth - User
  /auth/register/verify-otp:
    post:
      consumes:
      - application/json
      description: Memverifikasi kode OTP registrasi dan membuat akun baru beserta
        JWT token.
      parameters:
      - description: Register Verify OTP Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.RegisterVerifyOTPInput'
      produces:
      - application/json
      responses:
        "201":
          description: Registrasi akun berhasil!
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.AuthResponseData'
              type: object
        "400":
          description: OTP tidak sesuai / expired
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Verifikasi OTP & Buat Akun Pengguna
      tags:
      - Auth - User
  /events:
    get:
      consumes:
      - application/json
      description: Mengambil semua event konser yang terdaftar beserta kategori tiketnya.
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data konser
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.EventItem'
                  type: array
              type: object
        "500":
          description: Gagal mengambil data konser
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Mengambil daftar seluruh konser
      tags:
      - Public - Events
  /events/{id}:
    get:
      consumes:
      - application/json
      description: Mengambil detail spesifik dari satu konser berdasarkan ID.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail konser
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.EventItem'
              type: object
        "404":
          description: Konser tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Gagal mengambil detail konser
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Mengambil detail konser berdasarkan ID
      tags:
      - Public - Events
  /orders:
    post:
      consumes:
      - application/json
      description: Membuat pesanan tiket baru untuk event tertentu baik sebagai Guest
        maupun Logged-in User.
      parameters:
      - description: Order Request Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Pemesanan tiket berhasil!
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.OrderRecord'
              type: object
        "400":
          description: Payload tidak valid / Quota habis
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Gagal memproses pemesanan
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Membeli tiket / Membuat pesanan
      tags:
      - Public - Orders
  /refunds/request-otp:
    post:
      consumes:
      - application/json
      description: Meminta kode OTP yang akan dikirimkan ke email pemilik tiket untuk
        validasi refund.
      parameters:
      - description: Request Refund OTP Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.RequestRefundOTPInput'
      produces:
      - application/json
      responses:
        "200":
          description: Kode OTP verifikasi refund telah dikirim
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Data request tidak valid / Tiket tidak memenuhi syarat refund
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Kode pesanan tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Meminta kode OTP untuk pengajuan refund
      tags:
      - Refunds
  /refunds/status:
    post:
      consumes:
      - application/json
      description: Mengecek status terkini (PENDING, APPROVED, REJECTED, COMPLETED)
        dari pengajuan refund.
      parameters:
      - description: Check Refund Status Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.CheckRefundStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil status refund
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Data pengajuan refund tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Memeriksa status pengajuan refund tiket
      tags:
      - Refunds
  /refunds/submit:
    post:
      consumes:
      - application/json
      description: Mengirimkan detail rekening bank dan alasan refund setelah memverifikasi
        kode OTP.
      parameters:
      - description: Submit Refund Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.SubmitRefundInput'
      produces:
      - application/json
      responses:
        "200":
          description: Permohonan pengembalian dana berhasil diajukan
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Data tidak lengkap atau OTP tidak valid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Pengajuan refund tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Mengajukan formulir permohonan pengembalian dana (refund)
      tags:
      - Refunds
  /tickets/lookup:
    get:
      consumes:
      - application/json
      description: Mencari detail tiket E-Ticket berdasarkan order code (tanpa login).
      parameters:
      - description: 'Order Code (misal: SYM-XXXXXX)'
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tiket ditemukan
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.OrderRecord'
              type: object
        "400":
          description: Parameter code wajib diisi
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Tiket tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Lookup tiket berdasarkan kode pesanan
      tags:
      - Public - Tickets
  /user/change-password:
    post:
      consumes:
      - application/json
      description: Mengubah kata sandi user dengan mengonfirmasi kata sandi lama.
      parameters:
      - description: Change Password Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: Kata sandi akun Anda berhasil diperbarui
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Kata sandi lama salah / minimal 6 karakter
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Mengubah kata sandi akun
      tags:
      - User Profile
  /user/dashboard-summary:
    get:
      consumes:
      - application/json
      description: Mengambil statistik total tiket dibeli, konser mendatang, konser
        selesai, dan refund aktif.
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil ringkasan statistik akun
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.UserDashboardSummary'
              type: object
      security:
      - BearerAuth: []
      summary: Mengambil ringkasan statistik dashboard user
      tags:
      - User Profile
  /user/orders:
    get:
      consumes:
      - application/json
      description: Mengambil semua riwayat tiket/pesanan milik user yang sedang login.
      parameters:
      - description: Filter status pesanan (ISSUED, CHECKED_IN, REFUNDED, dll)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil riwayat pesanan
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.OrderRecord'
                  type: array
              type: object
        "401":
          description: Sesi tidak valid
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Mengambil riwayat pesanan pengguna
      tags:
      - User Profile
  /user/orders/{orderCode}:
    get:
      consumes:
      - application/json
      description: Mengambil detail spesifik pesanan berdasarkan kode pesanan untuk
        user yang login.
      parameters:
      - description: Order Code
        in: path
        name: orderCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil detail pesanan
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.OrderRecord'
              type: object
        "404":
          description: Pesanan tidak ditemukan
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Mengambil detail 1 pesanan pengguna
      tags:
      - User Profile
  /user/profile:
    put:
      consumes:
      - application/json
      description: Mengubah nama lengkap dan nomor telepon pengguna terautentikasi.
      parameters:
      - description: Update Profile Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProfileInput'
      produces:
      - application/json
      responses:
        "200":
          description: Profil berhasil diperbarui
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.UserRecord'
              type: object
        "400":
          description: Nama wajib diisi
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Memperbarui profil pengguna
      tags:
      - User Profile
  /user/refunds:
    get:
      consumes:
      - application/json
      description: Mengambil riwayat pengajuan refund tiket beserta status persetujuan
        dari admin.
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data pengajuan refund
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.RefundRequestRecord'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Mengambil daftar pengajuan refund pengguna
      tags:
      - User Profile
securityDefinitions:
  BearerAuth:
    description: Type "Bearer <your_token>" to authenticate user/admin endpoints.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
